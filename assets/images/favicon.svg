<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a896" />
      <stop offset="100%" stop-color="#028090" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdfa" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#004d40" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Water / Allergy Drop -->
  <path d="M256 90 C256 90, 140 246, 140 330 A116 116 0 0 0 372 330 C372 246, 256 90, 256 90 Z" 
        fill="url(#dropGrad)" filter="url(#shadow)" />

  <!-- Medical Care Cross Inside Droplet -->
  <path d="M256 250 V346 M208 298 H304" 
        stroke="#00a896" stroke-width="28" stroke-linecap="round" />
</svg>
