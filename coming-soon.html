<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon | AllerPure</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body class="auth-page">

  <div class="mesh mesh-1"></div>
  <div class="mesh mesh-2"></div>
  <div class="grid-overlay"></div>

  <div class="container container-narrow" style="text-align: center; position: relative; z-index: 2;">
    <a href="index.html" class="logo" style="justify-content: center; margin-bottom: var(--spacing-5); font-size: 1.75rem;">
        <svg class="logo-mark" viewBox="0 0 170 40" role="img" aria-label="AllerPure" xmlns="http://www.w3.org/2000/svg">
          <path fill-rule="evenodd" clip-rule="evenodd" fill="var(--logo-shield, #0D5C63)" d="M20,3 C24,3 28,4.5 32,7 L32,18 C32,27.5 27,34 20,37.5 C13,34 8,27.5 8,18 L8,7 C12,4.5 16,3 20,3 Z M20,13 C20,13 15,21 15,25 C15,28.3 17.5,31 20,31 C22.5,31 25,28.3 25,25 C25,21 20,13 20,13 Z" />
          <text x="52" y="27" font-family="Outfit, 'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="0.5" fill="var(--logo-wordmark, #0D5C63)">AllerPure</text>
        </svg>
      </a>

    <span class="pill" style="margin-bottom: var(--spacing-4);">
      <span class="dot"></span> In development
    </span>

    <h1 style="margin-bottom: var(--spacing-3); font-size: clamp(2.25rem, 7vw, 3.75rem);">
      Something new is <span class="serif grad-text">coming</span>
    </h1>

    <p class="lead" style="max-width: 48ch; margin: 0 auto var(--spacing-5);">
      We're expanding our clinical resources. Leave your email and we'll let you know
      the moment this page goes live.
    </p>

    <form class="validate-form" style="display: flex; gap: 10px; max-width: 460px; margin: 0 auto; flex-wrap: wrap;">
      <div class="form-group" style="flex: 1; min-width: 200px; margin: 0;">
        <label class="form-label" for="cs-email" style="position: absolute; left: -9999px;">Email</label>
        <input id="cs-email" type="email" class="form-control" required placeholder="you@example.com">
        <span class="error-message">Valid email is required</span>
      </div>
      <button type="submit" class="btn btn-primary">Notify me</button>
    </form>

    <p style="margin-top: var(--spacing-6);">
      <a href="index.html" class="small muted link-arrow" style="color: var(--color-text-subtle);">
        <i class="ph ph-arrow-left"></i> Back to site
      </a>
    </p>
  </div>

  <button class="back-to-top" type="button" aria-label="Back to top"><i class="ph ph-arrow-up" aria-hidden="true"></i></button>

  <script src="assets/js/main.js"></script>
</body>
</html>
